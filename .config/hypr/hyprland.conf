# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.config/hypr/omarchy3-defaults/autostart.conf
source = ~/.config/hypr/omarchy3-defaults/bindings/media.conf
source = ~/.config/hypr/omarchy3-defaults/bindings/clipboard.conf
source = ~/.config/hypr/omarchy3-defaults/bindings/tiling-v2.conf
source = ~/.config/hypr/omarchy3-defaults/bindings/utilities.conf
source = ~/.config/hypr/omarchy3-defaults/envs.conf
source = ~/.config/hypr/omarchy3-defaults/looknfeel.conf
source = ~/.config/hypr/omarchy3-defaults/input.conf
source = ~/.config/hypr/omarchy3-defaults/windows.conf
source = ~/.config/hypr/omarchy3-defaults/theme-hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Machine-specific config (drop files in conf.d/)
source = ~/.config/hypr/conf.d/*.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu
# thinkorswim: Java Swing windows carry the AWT fallback class java-lang-Thread
windowrule = workspace 32, match:class java-lang-Thread
# thinkorswim Order Gadget (the detached order-entry frame tos/broker.py types into): off-screen on a special workspace, the
# agent drives it there just the same; only the Order Confirmation Dialog shows, floating and centered on 32 (added 2026-10-26)
windowrule = workspace special:tosgadget silent, no_initial_focus on, match:class java-lang-Thread, match:title ^(Order Gadget)
windowrule = workspace 32, float on, match:class java-lang-Thread, match:title ^(Order Confirmation Dialog)$
# (no `center on`: it placed the dialog at x=5201, off the monitor; tos/broker.py positions it on the main window's monitor instead)
windowrule = match:class io.github.efogdev.mpris-timer, float on, center on
windowrule = match:class org.omarchy.fastfetch, float on, center on, size 800 520
windowrule = match:class zenity, float on, center on
windowrule = match:class org.freedesktop.impl.portal.desktop.kde, float on, center on, size 75% 50%
# Background layout editor: an ordinary window rather than an overlay, so it
# can be moved and closed. It sizes itself to the monitor's usable area, so
# centring lands it flush; the same rule catches its file chooser, a modal
# child that wants centring anyway.
windowrule = match:class omarchy.background-picker, float on, center on
windowrule = match:class omarchy.workspace-align, float on, center on
windowrule = tag +floating-window, match:class org.omarchy.zfs-manager
windowrule = tag +floating-window, match:class org.omarchy.vpn
exec-once = hyprsunset

# Stylus Mapping
device {
    name = quickspi-hid-045e:0c7f-stylus
    output = eDP-1
}

# Touchscreen Mapping (optional but recommended)
device {
    name = quickspi-hid-045e:0c7f-touchscreen
    output = eDP-1
}

# Absolute positioning fix
input {
    tablet {
        output = eDP-1
    }
}

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf
# ESPN fantasy automation Firefox (geckodriver, ~/Projects/FFF (Fable Fantasy Football) Experiment/browser): open on workspace 34 without stealing focus
windowrule = workspace 34 silent, no_initial_focus on, match:class ffl-firefox
# ffx agent profiles fallback (class ffx-<profile> not covered by ffx-windows.conf below): same treatment on 34
windowrule = workspace 34 silent, no_initial_focus on, match:class ^(ffx-.*)$

# ffx agent profile window pins (generated; ffx profile ws NAME N)
source = ~/.config/hypr/ffx-windows.conf

# Stocks panel window pins (must stay last so they override the per-class rules above)
source = ~/.config/hypr/stockpanel-windows.conf

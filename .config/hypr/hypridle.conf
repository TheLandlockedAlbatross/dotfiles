general {
    lock_cmd = ~/.local/bin/lock-screen                    # lock screen and 1password; password box on focused display
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true ~/.local/bin/lock-screen    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver at 10 minutes (all displays; omarchy-launch-screensaver
# walks every monitor).
listener {
    timeout = 600
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock at 15 minutes of real idle (screensaver launch at 600s resets the idle
# timer, so 600 + 300 = 900s wall time). LOCK_ONLY keeps the displays on for
# the 10 seconds until the blank listeners below turn them off.
listener {
    timeout = 300
    on-timeout = OMARCHY_LOCK_ONLY=true ~/.local/bin/lock-screen
    on-resume = omarchy-system-wake
}

# Screens off at 15:10 of real idle (600 + 310), belt-and-braces with the
# shell lock's 10s post-lock blank. Suspend is never automatic — hypridle has
# no suspend listener and logind IdleAction=ignore; only SUPER+SHIFT+CTRL+L
# (or a physical suspend key) sleeps the machine.
listener {
    timeout = 310
    on-timeout = omarchy-brightness-keyboard off; hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on; omarchy-system-wake
}

# WHILE LOCKED ONLY: blank the displays after 10s of no input, and wake them on
# activity, on a loop. hypridle is resume-aware (it re-arms after suspend), so
# this keeps working after a power-button wake where the lock plugin's own
# QML timer never gets a re-arm signal. Gated on lock state so it is a no-op
# during normal unlocked use.
listener {
    timeout = 10
    on-timeout = [[ "$(omarchy-shell lock isLocked 2>/dev/null)" == "true" ]] && { omarchy-brightness-keyboard off; hyprctl dispatch dpms off; }
    on-resume = [[ "$(omarchy-shell lock isLocked 2>/dev/null)" == "true" ]] && hyprctl dispatch dpms on
}

general {
    lock_cmd = ~/.local/bin/lock-screen                    # lock screen and 1password; password box on focused display
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true ~/.local/bin/lock-screen    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver at 20 minutes.
listener {
    timeout = 1200
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock at 25 minutes of real idle (screensaver launch at 1200s resets the idle
# timer, so 1200 + 300 = 1500s wall time). LOCK_ONLY keeps the displays on —
# they power off at the 30-minute mark below, not at lock time. Manual lock
# (lock_cmd above) blanks 3 seconds after locking (see ~/.local/bin/lock-screen).
listener {
    timeout = 300
    on-timeout = OMARCHY_LOCK_ONLY=true ~/.local/bin/lock-screen
    on-resume = omarchy-system-wake
}

# Screens off at 30 minutes of real idle. Same reset math as the lock
# listener: 1200 + 600 = 1800s wall time. Suspend is never automatic —
# hypridle has no suspend listener and logind IdleAction=ignore; only
# SUPER+SHIFT+CTRL+L (or a physical suspend key) sleeps the machine.
listener {
    timeout = 600
    on-timeout = omarchy-brightness-keyboard off; omarchy-brightness-display off
    on-resume = omarchy-system-wake
}

# Extra autostart processes
# exec-once = uwsm-app -- my-service
exec-once = ~/.config/hypr/scripts/monitor-fallback.sh
# OSD popup for external volume changes (e.g. QC35 II AVRCP volume rocker)
exec-once = ~/.config/hypr/scripts/volume-osd-watch.sh
exec-once = ~/.config/hypr/scripts/workspace-backgrounds.sh startup
# Workspace->monitor mapping from live geometry (decade per display; Super+E toggles split)
exec-once = ~/.config/hypr/scripts/workspace-map.sh apply

# Drop the internal panel to 60Hz on battery, back to 180Hz on AC.
exec-once = ~/.config/hypr/scripts/refresh-autoset.sh

# Correct the power profile after omarchy-powerprofiles-init forces performance on
# AC at login. Runs last (this file is sourced after omarchy's autostart); the delay
# lets init settle first. AC -> balanced, battery -> power-saver. Never performance.
exec-once = sleep 3 && /usr/local/bin/power-profile-autoset

# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  # kb_layout = us,dk,eu
  kb_layout = us
  kb_options = compose:caps # ,grp:alts_toggle

  # Change speed of keyboard repeat
  repeat_rate = 300
  repeat_delay = 500

  # Start with numlock on by default
  numlock_by_default = true

  # Increase sensitivity for mouse/trackpad (default: 0)
  sensitivity = 1.0

  # Flat = fixed gain, no velocity curve. Keeps pointer speed consistent
  # instead of varying with how fast you move (default is adaptive).
  accel_profile = flat


  scroll_method = on_button_down
  scroll_button = 274

  touchpad {
    # Use natural (inverse) scrolling
    # natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    # clickfinger_behavior = true

    # Control the speed of your scrolling.
    # Per-app windowrules at the bottom of this file multiply on top of this.
    scroll_factor = 0.4

    # Keep the touchpad live while typing. Default (true) blanks the touchpad
    # for a moment after every keystroke, which reads as the pointer "sticking".
    disable_while_typing = false

    # Left-click-and-drag with three fingers
    # drag_3fg = 1

    tap-to-click = false
  }
}

# Touchpad-specific overrides.
#
# The global sensitivity above is already pinned at 1.0, which is the hard
# ceiling libinput allows for the flat profile. To go faster than that the
# only lever is accel_profile = custom, which replaces libinput's built-in
# curve with an explicit one.
#
#   accel_profile = custom <step> <point0> <point1> ...
#
# Points are output speeds sampled at input speeds 0, step, 2*step, ...
# Past the last point the final slope is extrapolated forever. So two points
# on a straight line through the origin give a *flat* curve (constant gain,
# no velocity dependence) at any gain you like:
#
#   custom 1.0 0.0 2.5   ->  flat, 2.5x
#
# Tune the single trailing number. Higher = faster. 4.0 is very aggressive.
device {
  name = asustek-computer-inc.-gz302ea-keyboard-touchpad

  accel_profile = custom 1.0 0.0 2.5

  # The global scroll_method = on_button_down above is aimed at the mouse and
  # would otherwise disable two-finger scrolling here.
  scroll_method = 2fg
}

# Scroll nicely in the terminal
windowrule = match:class (Alacritty|kitty|foot), scroll_touchpad 1.5
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.2

# Enable touchpad gestures for changing workspaces
# See https://wiki.hyprland.org/Configuring/Gestures/
# gesture = 3, horizontal, workspace

# Bind built-in GZ302EA digitizer (stylus + touch) to laptop panel
device {
  name = elan9008:00-04f3:43c7-stylus
  output = eDP-1
}
device {
  name = elan9008:00-04f3:43c7
  output = eDP-1
}

# Bind external RTK MG156-FT03 (Ilitek 2900) stylus + touch to its panel.
# Bound by monitor description, not port, since it enumerates as DP-1 or DP-2
# depending on reconnect order.
device {
  name = ilitek-ilitek-2900-stylus
  output = desc:JMI FlipAction14T P0514202312
}
device {
  name = ilitek-ilitek-2900
  output = desc:JMI FlipAction14T P0514202312
}

# Align chords: put every display on the same slot inside its own decade, so
# slot 3 means 3, 13, 23 and 33 at once. A display only borrowing a decade
# because its own panel is unplugged keeps whatever it is showing.
bindd = SUPER CTRL ALT, 1, Align displays to slot 1, exec, ~/.config/hypr/scripts/workspace-map.sh align 1
bindd = SUPER CTRL ALT, 2, Align displays to slot 2, exec, ~/.config/hypr/scripts/workspace-map.sh align 2
bindd = SUPER CTRL ALT, 3, Align displays to slot 3, exec, ~/.config/hypr/scripts/workspace-map.sh align 3

# Workspace layers: 40 workspaces in four decades.
#   Super: 1-10   Caps: 11-20   Super+Alt: 21-30   Super+Caps: 31-40
# Which monitor owns which decade is derived from live geometry by
# workspace-map.sh (bottom-right display first, then clockwise).
# Caps is a held Mod3 modifier (input.conf: caps:hyper). Shift moves the
# focused window to the layer's workspace. Shift combos use keycodes
# (Shift+1 = '!'), matching Omarchy's keycode-based move binds.

# Reclaim digit keys from Omarchy defaults; both features move to the
# Ctrl family below.
unbind = SUPER ALT, code:10
unbind = SUPER ALT, code:11
unbind = SUPER ALT, code:12
unbind = SUPER ALT, code:13
unbind = SUPER ALT, code:14
unbind = SUPER SHIFT ALT, code:10
unbind = SUPER SHIFT ALT, code:11
unbind = SUPER SHIFT ALT, code:12
unbind = SUPER SHIFT ALT, code:13
unbind = SUPER SHIFT ALT, code:14
unbind = SUPER SHIFT ALT, code:15
unbind = SUPER SHIFT ALT, code:16
unbind = SUPER SHIFT ALT, code:17
unbind = SUPER SHIFT ALT, code:18
unbind = SUPER SHIFT ALT, code:19

# Relocated Omarchy features (Ctrl family = window tricks)
bindd = SUPER CTRL, code:10, Group window 1, changegroupactive, 1
bindd = SUPER CTRL, code:11, Group window 2, changegroupactive, 2
bindd = SUPER CTRL, code:12, Group window 3, changegroupactive, 3
bindd = SUPER CTRL, code:13, Group window 4, changegroupactive, 4
bindd = SUPER CTRL, code:14, Group window 5, changegroupactive, 5
bindd = SUPER CTRL SHIFT, code:10, Move silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER CTRL SHIFT, code:11, Move silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER CTRL SHIFT, code:12, Move silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER CTRL SHIFT, code:13, Move silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER CTRL SHIFT, code:14, Move silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER CTRL SHIFT, code:15, Move silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER CTRL SHIFT, code:16, Move silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER CTRL SHIFT, code:17, Move silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER CTRL SHIFT, code:18, Move silently to workspace 9, movetoworkspacesilent, 9

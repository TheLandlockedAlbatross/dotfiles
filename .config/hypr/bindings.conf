# Application bindings
bindd = SUPER, B, Browser, exec, firefox
bindd = SUPER, H, Toggle notify-focus, exec, ~/.config/hypr/scripts/notify-focus-tag.sh
bindd = SUPER SHIFT, K, Show free keybindings, exec, ~/.config/hypr/scripts/free-keys.sh
# Custom keybindings list with provenance dots (blue = committed, red = local).
# SUPER K stays on Omarchy's stock menu; pass no flag to keybinds-menu.sh for a
# dot-annotated full list if that's ever wanted again.
bindd = SUPER ALT, K, Show custom keybindings, exec, ~/.config/hypr/scripts/keybinds-menu.sh --custom-only
bindd = SUPER, Q, Timer, exec, uwsm-app -- flatpak run io.github.efogdev.mpris-timer
bindd = SUPER SHIFT, Q, Timer menu, exec, ~/.config/hypr/scripts/timer-menu.sh
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser (choose Profile), exec, firefox -P
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Password backup, exec, ~/.config/hypr/scripts/bw-backup-menu.sh

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, Gemini, exec, firefox -P "default-release" --new-window "https://gemini.google.com/app"
bindd = SUPER SHIFT ALT, A, Grok, exec, firefox -P "default-release" --new-window "https://grok.com"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Browser (Private), exec, firefox --private-window
bindd = SUPER SHIFT, X, Gemini (TLA), exec, firefox -P "TLA" --new-window "https://gemini.google.com/app"
bindd = SUPER SHIFT ALT, X, Grok (TLA), exec, firefox -P "TLA" --new-window "https://grok.com"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
# Brightness keys share the waybar dimmer: backlight first, then gamma below the
# hardware floor. Holding SUPER+SHIFT+F2 reliably climbs back out of a dark screen.
bindde = SUPER, F1, Brightness -1%, exec, ~/.config/waybar/step-brightness.sh -1
bindde = SUPER, F2, Brightness +1%, exec, ~/.config/waybar/step-brightness.sh +1
bindde = SUPER SHIFT, F1, Brightness -10%, exec, ~/.config/waybar/cycle-brightness.sh -10
bindde = SUPER SHIFT, F2, Brightness +10%, exec, ~/.config/waybar/cycle-brightness.sh 10
bindde = SUPER ALT, F1, Screen Temperature -100, exec, bash -c 'hyprctl hyprsunset temperature $(($(hyprctl hyprsunset temperature) - 100)); T=$(hyprctl hyprsunset temperature); I=$(awk "BEGIN{if($T<3600)print\"temperature-warm\";else if($T<=6000)print\"temperature-normal\";else print\"temperature-cold\"}"); ~/.config/hypr/scripts/swayosd-focused.sh --custom-icon "$I" --custom-progress $(awk "BEGIN{v=($T-1000)/5500; if(v<0)v=0; if(v>1)v=1; printf \"%.2f\",v}") --custom-progress-text "${T}K"'
bindde = SUPER ALT, F2, Screen Temperature +100, exec, bash -c 'hyprctl hyprsunset temperature $(($(hyprctl hyprsunset temperature) + 100)); T=$(hyprctl hyprsunset temperature); I=$(awk "BEGIN{if($T<3600)print\"temperature-warm\";else if($T<=6000)print\"temperature-normal\";else print\"temperature-cold\"}"); ~/.config/hypr/scripts/swayosd-focused.sh --custom-icon "$I" --custom-progress $(awk "BEGIN{v=($T-1000)/5500; if(v<0)v=0; if(v>1)v=1; printf \"%.2f\",v}") --custom-progress-text "${T}K"'
bindde = SUPER ALT SHIFT, F1, Screen Temperature -500, exec, bash -c 'hyprctl hyprsunset temperature $(($(hyprctl hyprsunset temperature) - 500)); T=$(hyprctl hyprsunset temperature); I=$(awk "BEGIN{if($T<3600)print\"temperature-warm\";else if($T<=6000)print\"temperature-normal\";else print\"temperature-cold\"}"); ~/.config/hypr/scripts/swayosd-focused.sh --custom-icon "$I" --custom-progress $(awk "BEGIN{v=($T-1000)/5500; if(v<0)v=0; if(v>1)v=1; printf \"%.2f\",v}") --custom-progress-text "${T}K"'
bindde = SUPER ALT SHIFT, F2, Screen Temperature +500, exec, bash -c 'hyprctl hyprsunset temperature $(($(hyprctl hyprsunset temperature) + 500)); T=$(hyprctl hyprsunset temperature); I=$(awk "BEGIN{if($T<3600)print\"temperature-warm\";else if($T<=6000)print\"temperature-normal\";else print\"temperature-cold\"}"); ~/.config/hypr/scripts/swayosd-focused.sh --custom-icon "$I" --custom-progress $(awk "BEGIN{v=($T-1000)/5500; if(v<0)v=0; if(v>1)v=1; printf \"%.2f\",v}") --custom-progress-text "${T}K"'

# Keyboard backlight: SHIFT + the brightness-cycle key cycles through standard colors
bindd = SHIFT, XF86KbdLightOnOff, Keyboard color cycle, exec, ~/.config/hypr/scripts/kb-color-cycle.sh

# Monitor toggle (rofi picker)
bindd = SUPER SHIFT, F6, Toggle monitor, exec, ~/.config/hypr/scripts/monitor-toggle.sh
bindd = SUPER SHIFT, F7, Rotate display, exec, ~/.config/hypr/scripts/monitor-rotate.sh
# Tap once for the monitor picker, twice to place the focused display directly
bindd = SUPER SHIFT, F8, Configure monitor layout, exec, ~/.config/hypr/scripts/monitor-configure-tap.sh
bindd = SUPER, E, Toggle workspace split, exec, ~/.config/hypr/scripts/workspace-split.sh toggle

bindd = SUPER SHIFT, S, Screenshot, exec, omarchy-capture-screenshot

bindd = SUPER CTRL ALT, SPACE, Next background, exec, omarchy-theme-bg-next
bindd = SUPER SHIFT CTRL ALT, SPACE, Previous background, exec, ~/.config/hypr/scripts/theme-bg-prev.sh
bindd = SUPER SHIFT CTRL ALT, B, Toggle invididual backgrounds, exec, ~/.config/hypr/scripts/workspace-backgrounds.sh toggle

bindd = SUPER ALT, ESCAPE, Screensaver, exec, $HOME/.config/hypr/scripts/screensaver.sh
bindd = SUPER SHIFT CTRL, L, Suspend, exec, systemctl suspend

# Keep-awake sleep inhibitor (mirrors reminder's set/show/clear modifiers)
bindd = SUPER CTRL, K, Keep awake, exec, ~/.config/hypr/scripts/sleep-inhibit.sh
bindd = SUPER CTRL ALT, K, Show keep-awake, exec, ~/.config/hypr/scripts/sleep-inhibit.sh show
bindd = SUPER SHIFT CTRL, K, Clear keep-awake, exec, ~/.config/hypr/scripts/sleep-inhibit.sh clear

bindd = SUPER SHIFT, C, Edit hypr/ config, exec, bash -c 'tmux new-session -c "${XDG_CONFIG_HOME}/hypr" "nvim ${XDG_CONFIG_HOME}/hypr" \; split-window -h -c "${XDG_CONFIG_HOME}/hypr" claude'

bindd = SUPER, Z, ZFS Manager, exec, omarchy-launch-tui ~/.config/hypr/scripts/zfs-manager.sh
bindd = SUPER SHIFT, T, btop, exec, $TERMINAL -e btop
bindd = SUPER SHIFT ALT, T, fastfetch, exec, xdg-terminal-exec --app-id=org.omarchy.fastfetch -e bash -c 'fastfetch; read -n 1 -s -r -p "Press any key to close..."'

# VPN
bindd = SUPER, M, VPN status, exec, ~/.config/hypr/scripts/vpn-status.sh
bindd = SUPER SHIFT, M, VPN node (next), exec, ~/.config/hypr/scripts/vpn-node-cycle.sh next
bindd = SUPER ALT, M, VPN relay (next/farther), exec, ~/.config/hypr/scripts/vpn-cycle.sh next
bindd = SUPER ALT SHIFT, M, VPN relay (prev/nearer), exec, ~/.config/hypr/scripts/vpn-cycle.sh prev
bindd = SUPER SHIFT CTRL ALT, M, VPN disconnect, exec, ~/.config/hypr/scripts/vpn-disconnect.sh
bindd = SUPER CTRL, M, VPN incognito toggle, exec, ~/.config/waybar/network-vpn-incognito.sh

# Workspace switching with toggle-back (unbind Omarchy keycode defaults first)
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19
bindd = SUPER, 1, Workspace 1, exec, ~/.config/hypr/scripts/workspace-switch.sh 1
bindd = SUPER, 2, Workspace 2, exec, ~/.config/hypr/scripts/workspace-switch.sh 2
bindd = SUPER, 3, Workspace 3, exec, ~/.config/hypr/scripts/workspace-switch.sh 3
bindd = SUPER, 4, Workspace 4, exec, ~/.config/hypr/scripts/workspace-switch.sh 4
bindd = SUPER, 5, Workspace 5, exec, ~/.config/hypr/scripts/workspace-switch.sh 5
bindd = SUPER, 6, Workspace 6, exec, ~/.config/hypr/scripts/workspace-switch.sh 6
bindd = SUPER, 7, Workspace 7, exec, ~/.config/hypr/scripts/workspace-switch.sh 7
bindd = SUPER, 8, Workspace 8, exec, ~/.config/hypr/scripts/workspace-switch.sh 8
bindd = SUPER, 9, Workspace 9, exec, ~/.config/hypr/scripts/workspace-switch.sh 9
bindd = SUPER, 0, Workspace 10, exec, ~/.config/hypr/scripts/workspace-switch.sh 10

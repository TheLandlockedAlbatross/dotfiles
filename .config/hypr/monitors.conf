# Hamlet: four identical 2560x1440 AOC panels in a 2x2 grid.
#   Top row:    DP-1 (left)  DP-2 (right)
#   Bottom row: DP-3 (left)  HDMI-A-1 (right, primary)
# HDMI caps at 144Hz (HDMI link limit); the DP panels run 165Hz.
monitor = DP-3, 2560x1440@165, 0x1152, 1.25
monitor = DP-1, 2560x1440@165, 0x0, 1.25
monitor = DP-2, 2560x1440@165, 2048x0, 1.25
monitor = HDMI-A-1, 2560x1440@143, 2048x1152, 1.25
# Fallback for anything else plugged in later
monitor = , preferred, auto, 1

# Workspace -> monitor rules live in the workspace-map block below, generated
# from the live geometry by workspace-map.sh (decade per monitor by default;
# Super+E toggles the two-display odd/even split). Rerun it after moving
# monitors around: ~/.config/hypr/scripts/workspace-map.sh apply

# BEGIN workspace-map (mode: decade); generated by workspace-map.sh, do not hand-edit
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1
workspace = 11, monitor:DP-3, default:true
workspace = 12, monitor:DP-3
workspace = 13, monitor:DP-3
workspace = 14, monitor:DP-3
workspace = 15, monitor:DP-3
workspace = 16, monitor:DP-3
workspace = 17, monitor:DP-3
workspace = 18, monitor:DP-3
workspace = 19, monitor:DP-3
workspace = 20, monitor:DP-3
workspace = 21, monitor:DP-1, default:true
workspace = 22, monitor:DP-1
workspace = 23, monitor:DP-1
workspace = 24, monitor:DP-1
workspace = 25, monitor:DP-1
workspace = 26, monitor:DP-1
workspace = 27, monitor:DP-1
workspace = 28, monitor:DP-1
workspace = 29, monitor:DP-1
workspace = 30, monitor:DP-1
workspace = 31, monitor:DP-2, default:true
workspace = 32, monitor:DP-2
workspace = 33, monitor:DP-2
workspace = 34, monitor:DP-2
workspace = 35, monitor:DP-2
workspace = 36, monitor:DP-2
workspace = 37, monitor:DP-2
workspace = 38, monitor:DP-2
workspace = 39, monitor:DP-2
workspace = 40, monitor:DP-2
# END workspace-map

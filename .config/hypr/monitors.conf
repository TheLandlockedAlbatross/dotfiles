# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Omarchy's default is `env = GDK_SCALE,2`, for a single retina-class 2x display.
# Disabled: it's one global integer scale, so it can't express a mixed setup
# (eDP-1 at 2x, HDMI-A-1 at 1x) and it breaks Firefox when a window crosses
# between the two. Wayland-native apps get the correct per-output scale from
# the compositor without it. Re-enable per-app if an XWayland app renders small.
# env = GDK_SCALE,2

# Laptop display (default when no external monitor)
# 180Hz is the AC rate; refresh-autoset.sh drops this to 60Hz on battery, carrying over
# whatever scale is live at the time.
monitor = eDP-1, 2560x1600@180, 5376x0, 2

monitor = HDMI-A-1, 2560x1440@143, 5376x-1200, 1.2
monitor = DP-2, 3840x2400@60, 1280x0, 1
monitor = DP-1, 1920x1080@60, -1200x0, 1.6

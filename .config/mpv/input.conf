## MPV Keyboard Shortcuts
## Have a lot of them match VLC for muscle memory + some convenient ones
UP          add volume  10
DOWN        add volume -10
LEFT        seek -10
RIGHT       seek 10

ALT+SHIFT+UP add video-pan-y 0.005
ALT+SHIFT+DOWN add video-pan-y -0.005
ALT+SHIFT+LEFT add video-pan-x 0.005
ALT+SHIFT+RIGHT add video-pan-x -0.005

SPACE       cycle pause                 # toggle pause
#ENTER       cycle pause                 # toggle pause
[           add speed -0.01             # 0.01 speed increments
]           add speed 0.01
# Semitone shifts with librubberband
ALT+[       af-command rb multiply-pitch 0.9438743126816935
ALT+]       af-command rb multiply-pitch 1.059463094352953
#ALT+SHIFT+[ af-command rb multiply-pitch 0.9994226138
#ALT+SHIFT+] af-command rb multiply-pitch 1.0005777895


# Tab
TAB         seek  30 - exact
SHIFT+TAB   seek -30 - exact

SHIFT+UP    ignore
SHIFT+DOWN  ignore
SHIFT+RIGHT seek  1 - exact
SHIFT+LEFT  seek -1 - exact

# Mouse buttons
MBTN_LEFT cycle pause
MBTN_RIGHT cycle mute
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2

# special character key maps

~           cycle ontop                 # keep mpv window on top of others


# numeric key maps

1           add contrast -1
2           add contrast 1
3           add brightness -1
4           add brightness 1
5           add gamma -1
6           add gamma 1
7           add saturation -1
8           add saturation 1
9           add volume -2
0           add volume 2


# alphabet keymaps

g           add sub-delay   -0.1        # subtitle delays (100ms)
h           add sub-delay   +0.1
j           add audio-delay -0.1        # audio delays (100ms)
k           add audio-delay +0.1

o           cycle video-unscaled        # scale/unscale video
O           no-osd cycle-values osd-level 3 1
a           cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"

#t           show_progress               # show video progress bar
#T           osd                         # cycle through osd mode
c           cycle sub-visibility
v           cycle sub                   # cycle through subs
b           cycle audio                 # cycle through audio streams
m           cycle mute                  # toggle mute
n                  playlist-next
p                  playlist-prev
SHIFT+N     add chapter 1
SHIFT+P     add chapter -1
PGDWN       add chapter 1
PGUP        add chapter -1
# Frame-by-frame scrolling
SHIFT+WHEEL_UP frame-step
SHIFT+WHEEL_DOWN frame-back-step
# Reverse loop
ctrl+l script-binding reverse_loop/bouncing-loop # same as ";" (script default); was dead name "toggle-reverse-loop"

# Chapters
ctrl+n  script-binding chapters/add_chapter
ctrl+m  		script-binding chapters/remove_chapter
ctrl+.  		script-binding chapters/edit_chapter
ctrl+SHIFT+n       	script-binding chapters/write_chapters
ctrl+b  		script-binding chapters/write_xml
B       		script-binding chapters/write_txt
ctrl+,  		script-binding chapters/bake_chapters
K       		script-binding chapters/mkvpropedit

# Clip recorder
ctrl+z          script-binding clip/clip_start
ctrl+x          script-binding clip/clip_stop
ctrl+a          script-binding clip/clip_write
ctrl+SHIFT+a    script-binding clip/clip_convert
ctrl+SHIFT+x    script-binding clip/clip_cancel
ctrl+SHIFT+o    script-binding clip/clip_options

# uosc menus (script defaults also bound: ":" 123-loop, ";" bouncing-loop, ctrl+t copy-time)
ctrl+k          script-binding uosc/keybinds

# ~~/ expands to whichever config dir this mpv instance uses
# (~/.config/mpv for native, ~/.var/app/io.mpv.Mpv/config/mpv for flatpak),
# so this file is identical for both installs.
include=~~/conf/audio.conf
include=~~/conf/loops.conf
include=~~/conf/screenshots.conf
include=~~/conf/subtitles.conf
include=~~/conf/uosc.conf
# MACHINE-SPECIFIC: hamlet (RTX 4090, nvidia driver 575.xx) — swap out on other machines
include=~~/conf/gpu-nvidia-4090-575.conf

af=@rb:rubberband=mixed
keepaspect-window=no
force-window-position

# Subtitle appearance
sub-font='Georgia'
sub-font-size=20
sub-color='#FFFFFFFF'
sub-border-color='#FF000000'
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color='#33000000'
sub-ass-override=force

# Volume
volume-max=200

# uosc (replaces the built-in OSC and OSD bar)
osc=no
osd-bar=no
border=no

#          ╔══════════════════════════════════════════════════════════╗
#          ║  MACHINE-SPECIFIC GPU CONFIG                             ║
#          ║  Host: hamlet — NVIDIA RTX 4090, driver 575.57.08        ║
#          ║  Uses nvdec + vo=gpu-next; do NOT include on machines    ║
#          ║  without an NVIDIA GPU — write a sibling gpu-*.conf.     ║
#          ╚══════════════════════════════════════════════════════════╝

# #          ╭──────────────────────────────────────────────────────────╮
# #          │                    all gas no brakes                     │
# #          ╰──────────────────────────────────────────────────────────╯
# # Maximum quality GPU profile
# profile=high-quality

# # Explicit NVIDIA hardware decoding for best compatibility and efficiency
# hwdec=nvdec
# hwdec-codecs=all

# # Output driver
# vo=gpu-next

# # Color management for perfect accuracy
# target-prim=bt.2020
# target-trc=smpte2084
# icc-profile-auto
# correct-downscaling=yes

# # Debanding: maximum quality
# deband=yes
# deband-iterations=4
# deband-threshold=48
# deband-range=24
# deband-grain=8

# # Highest-quality scalers and processing
# scale=ewa_lanczossharpest
# scale-blur=0.981251
# cscale=ewa_lanczossharpest
# dscale=ewa_lanczossharpest
# dither-depth=auto
# dither=error-diffusion
# sigmoid-upscaling=yes
# linear-downscaling=yes
# correct-downscaling=yes

# # Advanced upscaling (GLSL shaders, if desired and available)
# # Uncomment and set the path to your preferred shader
# # glsl-shaders="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"

# # Output full-range RGB (if your display supports it)
# gpu-output-range=full

# # HDR passthrough (if using HDR display)
# hdr-compute-peak=yes
# tone-mapping=auto
# tone-mapping-mode=clip

# # Subtitle rendering (maximum quality)
# sub-font-provider=libass
# sub-ass-style-overrides='Outline=2,Shadow=0,BorderStyle=3,Fontsize=48'

# # No frame drop, always prioritize quality
# hr-seek-framedrop=no

#          ╭──────────────────────────────────────────────────────────╮
#          │                      gas and brakes                      │
#          ╰──────────────────────────────────────────────────────────╯

# profile=default (redundant)

# Use NVIDIA hardware decoding explicitly for best performance on Linux
hwdec=nvdec
hwdec-codecs=all

# Modern output driver optimized for NVIDIA GPUs
vo=gpu-next

# Color management for accurate colors with minimal overhead
target-prim=bt.709
target-trc=bt.1886
icc-profile-auto
correct-downscaling=yes

# Debanding enabled but moderate settings for speed
deband=yes
deband-iterations=1
deband-threshold=35
deband-range=16
deband-grain=2

# Scalers tuned for perceptually good quality but fast execution
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
dither-depth=auto
linear-downscaling=yes
sigmoid-upscaling=yes

# Optional: reduce frame drops for smooth playback
hr-seek-framedrop=no

# #          ╭──────────────────────────────────────────────────────────╮
# #          │                    all brakes no gas                     │
# #          ╰──────────────────────────────────────────────────────────╯

# # Minimal GPU profile for speed
# profile=fast

# # Fastest hardware decoding (explicit for NVIDIA)
# hwdec=nvdec
# hwdec-codecs=all

# # Output driver: vo=gpu is slightly faster than vo=gpu-next in high-load scenarios[7]
# vo=gpu

# # Color management: keep only essential, disable ICC profile
# target-prim=bt.709
# target-trc=bt.1886
# correct-downscaling=no
# icc-profile-auto=no

# # Debanding: off for speed
# deband=no

# # Scalers: use fast, low-overhead algorithms
# scale=bilinear
# cscale=bilinear
# dscale=bilinear
# dither-depth=8bit
# dither=no
# linear-downscaling=no
# sigmoid-upscaling=no

# # Frame drop allowed for smoothness under load
# hr-seek-framedrop=yes

# # Optional: Lower subtitle rendering quality if needed
# sub-font-provider=libass
# sub-ass-style-overrides='Outline=1,Shadow=0,BorderStyle=1,Fontsize=36'


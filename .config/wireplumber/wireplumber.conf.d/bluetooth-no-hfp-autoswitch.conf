## Never auto-switch Bluetooth to the low-quality HFP/headset profile just
## because an app (DaVinci Resolve at launch, browsers on mic permission)
## opens an audio input. Playback stays on A2DP; anything that truly needs
## the QC35 mic can switch profiles explicitly in pavucontrol/wpctl.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
